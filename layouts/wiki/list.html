{{ define "main" }}
<div class="wiki-shell">
  {{ partial "wiki-nav.html" . }}
  <main class="wiki-article wiki-index" data-pagefind-ignore>
    <h1>{{ .Title }}</h1>
    <p>{{ len .Pages }} migrated articles. Browse alphabetically or use search.</p>
    <ol class="article-list">
      {{ range .Pages.ByTitle }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}
    </ol>
  </main>
  <aside class="wiki-tools"><h2>Browse</h2><a href="/categories/">View categories</a></aside>
</div>
{{ end }}
